<!doctype html>
<html lang="en">
  <head>
    <title>Product Search</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Search" />
    <meta name="keywords" content="Product Search" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__bar">
          <a class="brand" href="/" aria-label="ACME home">
            <span class="brand__mark">🚀</span>
            <span class="brand__name">ACME</span>
          </a>
        </div>
        <h1 class="page-title">Product Search</h1>
        <form class="search" role="search">
          <label class="search__label" for="q">Search</label>
          <div class="search__row">
            <input class="search__input" type="search" id="q" placeholder="Search" />
            <button class="button button--primary search__submit">
              <i data-feather="search"></i>
            </button>
          </div>
        </form>
      </div>
    </header>

    <main class="results">
      <div class="results__toolbar">
        <p class="results__summary">5 results</p>
        <div class="sort">
          <label class="sort__label" for="sort">Sort</label>
          <select class="sort__select" id="sort">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
      </div>
      <ul class="result-list">
        <li class="result-list__item">
          <div class="result-list__info">
            <h2 class="result__name">Product Name</h2>
            <div class="result__meta">
              <div class="result__vendor">Vendor Name</div>
              <div class="result__eta">
                <i class="result__eta-icon" data-feather="clock"></i>
                <span>
                  <span class="result__eta-label">Delivery in</span>
                  25 - 35 min
                </span>
              </div>
            </div>
          </div>
          <div class="result__enrich">
            <span class="price">R89.00</span>
            <span class="badge badge__in-stock">Available</span>
          </div>
        </li>

        <li class="result-list__item">
          <div class="result-list__info">
            <h2 class="result__name">Product Name</h2>
            <div class="result__meta">
              <div class="result__vendor">Vendor Name</div>
              <div class="result__eta">
                <i class="result__eta-icon" data-feather="clock"></i>
                <span>
                  <span class="result__eta-label">Delivery in</span>
                  25 - 35 min
                </span>
              </div>
            </div>
          </div>
          <div class="result__enrich">
            <span class="price">R89.00</span>
            <span class="badge badge__low-stock">Only a few left</span>
          </div>
        </li>

        <li class="result-list__item" aria-hidden="true">
          <div class="result-list__info">
            <div class="skeleton skeleton__name"></div>
            <div class="result__meta">
              <div class="skeleton skeleton__vendor"></div>
              <div class="skeleton skeleton__eta"></div>
            </div>
          </div>
          <div class="result__enrich">
            <span class="skeleton skeleton__price"></span>
            <span class="skeleton skeleton__badge"></span>
          </div>
        </li>

      </ul>
    </main>

    <script>
      feather.replace();
    </script>
  </body>
</html>
