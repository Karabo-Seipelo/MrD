<!doctype html>
<html lang="en">
  <head>
    <title>Product Search</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Search" />
    <meta name="keywords" content="Product Search" />
    <link rel="stylesheet" href="./styles.css?v6" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__bar">
          <a class="brand" href="/" aria-label="ACME home">
            <span class="brand__mark">🚀</span>
            <span class="brand__name">ACME</span>
          </a>
        </div>
        <h1 class="page-title">Product Search</h1>
        <form class="search" role="search">
          <div class="search__query">
            <label class="search__label" for="q">Search the catalogue</label>
            <div class="search__row">
              <div class="search__field">
                <input
                  id="q"
                  name="q"
                  class="search__input"
                  type="search"
                  placeholder="Try 'apple' or 'ice cream'"
                  autocomplete="off"
                  aria-autocomplete="list"
                  aria-controls="suggest-list"
                  aria-expanded="false"
                />
                <ul
                  id="suggest-list"
                  class="suggest"
                  role="listbox"
                  hidden
                ></ul>
              </div>
              <button
                class="button button--primary search__submit"
                aria-label="Search"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
            </div>
          </div>
          <div class="search__tools">
            <div class="search__refine">
              <fieldset class="chips">
                <legend class="u-sr">Category</legend>
                <div class="chips__track">
                  <button type="button" class="chips__clear button--clear">
                    Clear
                  </button>
                </div>
              </fieldset>
            </div>
            <div class="sort">
              <label class="sort__label" for="sort">Sort</label>
              <div class="sort__control">
                <select class="sort__select" id="sort" name="sort">
                  <option value="asc">Price: low to high</option>
                  <option value="desc">Price: high to low</option>
                </select>
              </div>
            </div>
          </div>
        </form>
      </div>
    </header>

    <main class="results">
      <div class="results__toolbar">
        <p class="results__summary"></p>
      </div>

      <template id="search-error">
        <section class="search-error" aria-labelledby="search-error-title">
          <h2 class="search-error__title" id="search-error-title">
            Search isn't working right now
          </h2>
          <p class="search-error__body">
            Your search and filters are saved. Try again in a moment.
          </p>
          <div class="search-error__actions">
            <button class="button button--primary" type="button">
              Try again
            </button>
          </div>
        </section>
      </template>

      <template id="result">
        <li class="result-list__item">
          <h2 class="result__name">Product Name</h2>
          <span class="price">R89.00</span>
          <div class="result__meta">
            <div class="result__vendor">Vendor Name</div>
            <div class="result__eta">
              <svg
                class="result__eta-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="result__eta-text">25 - 35 min</span>
            </div>
          </div>
          <span class="badge"></span>
        </li>
      </template>

      <template id="skeleton">
        <li class="result-list__item" aria-hidden="true">
          <div class="skeleton skeleton__name"></div>
          <span class="skeleton skeleton__price"></span>
          <div class="result__meta">
            <div class="skeleton skeleton__vendor"></div>
            <div class="skeleton skeleton__eta"></div>
          </div>
          <span class="skeleton skeleton__badge"></span>
        </li>
      </template>

      <div class="results__status"></div>

      <ul class="result-list"></ul>
    </main>

    <script type="module">
      let current = null;
      const summary = document.querySelector(".results__summary");
      const list = document.querySelector(".result-list");
      const skeleton = document.querySelector("#skeleton");
      const result = document.querySelector("#result");
      const form = document.querySelector(".search");
      const query = document.querySelector("#q");
      const sort = document.querySelector("#sort");
      const chips = document.querySelector(".chips");
      const track = document.querySelector(".chips__track");
      const chipsClear = document.querySelector(".chips__clear");
      const searchError = document.querySelector("#search-error");
      const status = document.querySelector(".results__status");
      const money = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "ZAR",
        currencyDisplay: "narrowSymbol",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      const suggestList = document.querySelector("#suggest-list");
      const searchField = document.querySelector(".search__field");
      let suggestTimer = null;
      let suggestAbort = null;
      let lastSuggestion = "";
      const suggestCache = new Map();
      const SUGGEST_DELAY_MS = 280;
      const SUGGEST_MIN = 2;
      const searchCache = new Map();
      const SEARCH_CACHE_MAX = 20;

      function rememberSearch(key, data) {
        searchCache.delete(key);
        searchCache.set(key, data);
        if (searchCache.size > SEARCH_CACHE_MAX) {
          searchCache.delete(searchCache.keys().next().value);
        }
      }

      function formatCurrency(value) {
        return money
          .formatToParts(value)
          .filter((part) => part.type !== "literal")
          .map((part) => part.value)
          .join("");
      }

      function show(state, data) {
        if (state === "loading") {
          status.replaceChildren();
          summary.textContent = "Loading...";
          list.setAttribute("aria-busy", "true");
          list.replaceChildren(skeleton.content.cloneNode(true));
          return;
        }

        list.removeAttribute("aria-busy");

        if (state === "error") {
          summary.textContent = "";
          list.replaceChildren();
          const node = searchError.content.cloneNode(true);
          node.querySelector("button").addEventListener("click", search);
          status.replaceChildren(node);
          return;
        }

        status.replaceChildren();
        summary.textContent = `${data.total} results`;
        list.replaceChildren(...data.products.map(card));
      }

      function card(product) {
        const node = result.content.cloneNode(true);
        const badge = node.querySelector(".badge");
        const status = product.availabilityStatus.toLowerCase();

        node.querySelector(".result__name").textContent = product.title;
        node.querySelector(".result__vendor").textContent = product.brand ?? "";
        node.querySelector(".price").textContent = formatCurrency(product.price);

        if (status === "in stock") {
          badge.className = "badge badge__in-stock";
          badge.textContent = "Available";
          node.querySelector(".result__eta-text").textContent =
            product.shippingInformation;
        } else if (status === "low stock") {
          badge.className = "badge badge__low-stock";
          badge.textContent = "Only a few left";
          node.querySelector(".result__eta").remove();
        }

        return node;
      }

      function chip(name) {
        const label = document.createElement("label");
        label.className = "chip";

        const input = document.createElement("input");
        input.className = "chip__input";
        input.type = "radio";
        input.name = "category";
        input.value = name;

        const text = document.createElement("span");
        text.className = "chip__label";
        text.textContent = name.charAt(0).toUpperCase() + name.slice(1);

        label.append(input, text);
        return label;
      }

      function selectedCategory() {
        const selected = chips.querySelector('input[name="category"]:checked');
        return selected ? selected.value : "";
      }

      function categoryForRequest() {
        const selected = selectedCategory();
        if (selected) return selected;
        return (
          new URLSearchParams(location.search).get("category") ?? ""
        ).trim();
      }

      function hideSuggestions() {
        suggestList.hidden = true;
        suggestList.replaceChildren();
        query.setAttribute("aria-expanded", "false");
      }

      function renderSuggestion(items) {
        suggestList.replaceChildren();
        if (!items.length) {
          hideSuggestions();
          return;
        }

        for (const title of items) {
          const li = document.createElement("li");
          li.className = "suggest__item";
          li.setAttribute("role", "option");
          li.textContent = title;
          li.addEventListener("click", () => {
            query.value = title;
            hideSuggestions();
            search();
          });
          suggestList.append(li);
        }
        suggestList.hidden = false;
        query.setAttribute("aria-expanded", "true");
      }

      async function updateSuggestions() {
        const q = query.value.trim();
        if (q.length < SUGGEST_MIN) {
          hideSuggestions();
          lastSuggestion = "";
          return;
        }

        if (q === lastSuggestion) return;

        const cached = suggestCache.get(q);

        if (cached) {
          lastSuggestion = q;
          renderSuggestion(cached);
          return;
        }

        suggestAbort?.abort();
        suggestAbort = new AbortController();

        try {
          const params = new URLSearchParams({ q, limit: "8" });
          const response = await fetch(`/products/suggest?${params}`, {
            signal: suggestAbort.signal,
          });

          if (!response.ok) {
            hideSuggestions();
            return;
          }

          const data = await response.json();
          const suggestions = Array.isArray(data.suggestions)
            ? data.suggestions
            : [];
          suggestCache.set(q, suggestions);
          lastSuggestion = q;
          renderSuggestion(suggestions);
        } catch (error) {
          if (error.name === "AbortError") return;
          hideSuggestions();
        }
      }

      async function loadCategories() {
        const response = await fetch("/products/categories");
        const data = await response.json();
        const clear = track.querySelector(".chips__clear");
        for (const name of data.categories) {
          track.insertBefore(chip(name), clear);
        }
      }

      async function search({ record = true } = {}) {
        hideSuggestions();
        if (record) writeUrl();
        current?.abort();
        current = new AbortController();

        const params = new URLSearchParams({
          q: query.value,
          sort: sort.value,
          category: categoryForRequest(),
        });
        const key = params.toString();
        const cached = searchCache.get(key);

        if (cached) {
          show("results", cached);
          console.log(`search cache hit`, key);
          return;
        }

        const started = performance.now();

        show("loading");

        try {
          const response = await fetch(`/products?${params}`, {
            signal: current.signal,
          });
          const data = await response.json();
          show(response.ok ? "results" : "error", data);
          if (response.ok) rememberSearch(key, data);
          const ms = Math.round(performance.now() - started);
          console.log(`search ${response.status} ${ms}ms`, params.toString());
        } catch (error) {
          if (error.name === "AbortError") return;
          show("error", { error: "Failed to load products." });
          console.log(
            `search failed ${Math.round(performance.now() - started)}ms`,
          );
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        search();
      });

      query.addEventListener("input", () => {
        clearTimeout(suggestTimer);
        suggestTimer = setTimeout(updateSuggestions, SUGGEST_DELAY_MS);
      });

      query.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideSuggestions();
      });

      document.addEventListener("click", (event) => {
        if (!searchField.contains(event.target)) hideSuggestions();
      });

      sort.addEventListener("change", search);

      chips.addEventListener("change", search);

      chipsClear.addEventListener("click", (event) => {
        event.preventDefault();
        const selected = chips.querySelector('input[name="category"]:checked');
        if (selected) selected.checked = false;
        search();
      });

      window.addEventListener("online", () => {
        if (status.querySelector(".search-error")) search();
      });

      function showEmpty() {
        current?.abort();
        hideSuggestions();
        status.replaceChildren();
        summary.textContent = "";
        list.replaceChildren();
        list.removeAttribute("aria-busy");
      }

      window.addEventListener("popstate", (event) => {
        applyFromLocation();
        if (location.search || event.state?.searched) {
          search({ record: false });
        } else {
          showEmpty();
        }
      });

      function writeUrl() {
        const params = new URLSearchParams();
        const text = query.value.trim();
        const category = selectedCategory();
        if (text) params.set("q", text);
        if (category) params.set("category", category);
        if (sort.value === "desc") params.set("sort", "desc");

        const next = params.toString();
        const url = next ? `${location.pathname}?${next}` : location.pathname;
        const state = { searched: true };
        if (url === location.pathname + location.search) {
          if (!history.state?.searched) history.replaceState(state, "", url);
          return;
        }
        history.pushState(state, "", url);
      }

      function applyFromLocation() {
        const params = new URLSearchParams(location.search);
        const category = (params.get("category") ?? "").trim().toLowerCase();

        query.value = params.get("q") ?? "";
        sort.value = params.get("sort") === "desc" ? "desc" : "asc";

        for (const input of chips.querySelectorAll("input[name='category']")) {
          input.checked =
            category !== "" && input.value.toLowerCase() === category;
        }
      }

      applyFromLocation();
      try {
        await loadCategories();
      } catch {
        console.error("Failed to load categories");
      }
      applyFromLocation();
      if (location.search) search({ record: false });
    </script>
  </body>
</html>
