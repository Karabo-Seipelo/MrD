openapi: 3.1.0
info:
  title: MrD Product Search API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /products:
    get:
      summary: Search and enrich products
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 40, default: 10 }
      responses:
        "200":
          description: Search results
          headers:
            Cache-Control:
              schema: { type: string }
              description: no-store when enrichment is not ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsSearchResponse"
  /offers:
    get:
      summary: Enrich specific product ids
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated product ids
          schema: { type: string, example: "1,2" }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Enriched subset
        "400":
          description: Missing ids
  /products/categories:
    get:
      summary: List categories
      responses:
        "200":
          description: Category names
  /products/suggest:
    get:
      summary: Title suggestions
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 20, default: 8 }
      responses:
        "200":
          description: Suggestion titles
components:
  schemas:
    ProductsSearchResponse:
      type: object
      required:
        - products
        - total
        - page
        - limit
        - query
        - enrichment
        - attempts
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedProduct"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 40
        query:
          type: string
        enrichment:
          type: string
          enum: [ok, partial, failed]
        attempts:
          type: integer
          minimum: 0
    CatalogProduct:
      type: object
      required: [id, title, description, category]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        brand: { type: string }
        tags:
          type: array
          items: { type: string }
    EnrichedProduct:
      allOf:
        - $ref: "#/components/schemas/CatalogProduct"
        - type: object
          properties:
            price: { type: number }
            availabilityStatus: { type: string }
            shippingInformation: { type: string }
